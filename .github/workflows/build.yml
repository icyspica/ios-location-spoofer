name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Unsigned App and Package IPA
        run: |
          # 1. Find project or workspace
          PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          
          # 2. Auto-detect the primary scheme name
          SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | tr -d ' ' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME="LocationSpoofer"
          fi
          echo "Using Scheme: $SCHEME"

          # 3. Build project with explicit destination parameter
          if [[ "$PROJ" == *.xcworkspace ]]; then
            xcodebuild build \
              -workspace "$PROJ" \
              -scheme "$SCHEME" \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild build \
              -project "$PROJ" \
              -scheme "$SCHEME" \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

          # 4. Create Payload directory and package IPA
          mkdir -p Payload
          cp -R build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
          zip -r LocationSpoofer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-IPA
          path: LocationSpoofer.ipa
